<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Generated box probe</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px/1.5 sans-serif; }
  section { padding: 12px; border-top: 2px solid #30363d; }

  /* A generated box is a box, not a text run: `content: ""` with a stated size
     is how a page draws a disc behind an icon or a wash behind a card. */
  .disc { --bg: #ffffff2e; position: relative; width: 44px; height: 44px;
          display: flex; align-items: center; justify-content: center; }
  .disc::before { content: ""; background: var(--bg); border-radius: 50%;
                  width: 100%; height: 100%; position: absolute; }
  .disc span { position: relative; }

  /* Text content still reads as text, and takes the pseudo's own colour. */
  .quote::before { content: "“"; color: #f0883e; font-size: 32px; }
  .quote::after { content: "”"; color: #f0883e; font-size: 32px; }

  /* A generated box laid out in flow, sized and coloured by itself. */
  .rule::after { content: ""; display: block; height: 4px; width: 120px;
                 background: linear-gradient(90deg, #a371f7, #2f81f7); margin-top: 8px; }

  /* An inherited custom property reaching a generated box. */
  .card { --accent: #3fb950; padding: 12px; background: #161b22; position: relative; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
                  width: 4px; background: var(--accent); }

  /* `content: none` suppresses the box entirely. */
  .off::before { content: none; display: block; width: 80px; height: 20px; background: #f85149; }

  /* A counter-ish marker: an empty inline generated box takes no room. */
  .empty::before { content: ""; }
</style>
</head>
<body>
  <section><div class="disc"><span>II</span></div></section>
  <section><p class="quote">a generated quote mark on each side</p></section>
  <section><h3 class="rule">a heading with a generated rule under it</h3></section>
  <section><div class="card">a card with a generated accent stripe</div></section>
  <section><div class="off">content: none draws nothing</div></section>
  <section><span class="empty">an empty generated box takes no room</span></section>
</body>
</html>
