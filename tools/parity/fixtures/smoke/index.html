<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smoke</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #ffffff; color: #111111; }
  header { background: #24292f; color: #ffffff; padding: 16px 24px; }
  .row { display: flex; gap: 12px; padding: 24px; }
  .card { flex: 1; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; background: #f6f8fa; }
  h1 { font-size: 24px; margin: 0; }
  p { line-height: 1.5; margin: 0 0 8px; }
  .pill { display: inline-block; background: #0969da; color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
</style>
</head>
<body>
  <header><h1>Smoke test</h1></header>
  <div class="row">
    <div class="card"><p>First card body text that should wrap onto more than one line inside its column.</p><span class="pill">alpha</span></div>
    <div class="card"><p>Second card body text.</p><span class="pill">beta</span></div>
  </div>
</body>
</html>
