<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom property probe</title>
<style>
  body { margin: 0; font: 20px/1.6 sans-serif; background: #fff; }
  :root, [data-color-mode="light"] { --scale-white: #fff; --scale-black: #000; --text-default: var(--scale-black); }
  [data-color-mode="dark"] { --scale-white: #fff; --text-default: var(--scale-white); }
  .panel { background: #001a4d; padding: 12px; }
  .title { color: var(--text-default); margin: 0; }
  .chained { color: var(--a, var(--b, #f0f)); }
  .fallback { color: var(--nope, #0a0); }
  section { padding: 6px 12px; }
  /* Arithmetic on a custom property — how spacing scales are derived. */
  :root { --gutter: 48px; --half: calc(var(--gutter) / 2); }
  .calcpad { padding-left: calc(var(--gutter) * .5); background: #eef; }
  .calcnested { margin-left: var(--half); background: #efe; }
  .calcclamp { width: clamp(120px, calc(var(--gutter) * 6), 400px); background: #fee; }
</style>
</head>
<body>
  <div data-color-mode="light">
    <section><p class="title">LIGHT should be black</p></section>
    <div data-color-mode="dark">
      <div class="panel"><p class="title">DARK should be white on navy</p></div>
    </div>
    <section><p class="chained">CHAINED fallback should be magenta</p></section>
    <section><p class="fallback">FALLBACK should be green</p></section>
    <section><p class="calcpad">calc(var * .5) padding should be 24px</p></section>
    <section><p class="calcnested">nested calc var margin should be 24px</p></section>
    <section><p class="calcclamp">clamp with calc(var) should be 288px wide</p></section>
  </div>
</body>
</html>
