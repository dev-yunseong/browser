<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Shrink-to-fit of a nested form probe</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 sans-serif; background: #fff; }

  /* A column flex container centres its items on the cross axis, so each item
     is sized shrink-to-fit: min(max-content, available). The max-content of a
     row flex container is the sum of its items' max-contents plus the gaps,
     and that sum has to see through a plain block (`form`) and through any
     number of nested flex containers to the stated width at the bottom. */
  .hero { display: flex; flex-direction: column; align-items: center; padding: 0 24px; background: #eef; }

  .cta { display: flex; justify-content: center; align-items: flex-end; gap: 16px; flex-wrap: wrap; background: #dfd; }
  .cta form { background: #ffd; }
  .control { display: flex; }
  .control-container { display: flex; align-items: center; gap: 4px; border: 1px solid #333; padding: 3px; background: #fff; }
  .field-wrap { width: 100%; display: flex; position: relative; background: #cff; }
  /* A label floated over the field it names. It is out of flow, so it must not
     widen the field it sits on. */
  .field-label { position: absolute; top: 12px; left: 18px; font-size: 16px; color: #444; }
  /* The label replaces the placeholder, so the placeholder is hidden. Drawing
     both left two strings on top of each other. */
  .field-wrap input::placeholder { opacity: 0; }
  /* A second field keeps its placeholder, in the colour the page asks for. */
  .plain input::placeholder { color: #b00; }
  .field-wrap span { width: inherit; }
  .field-wrap input { width: 260px; padding: 18px 12px 0 18px; font-size: 24px; border: 0; background: transparent; }
  .submit { flex-shrink: 0; height: 48px; padding: 6px 20px; border: 1px solid #060; background: #0a0; color: #fff; font-size: 16px; }
  .secondary { height: 56px; padding: 6px 20px; border: 1px solid #333; background: #eee; display: flex; align-items: center; text-decoration: none; color: #000; }

  /* The same shape one level simpler: a block wrapping a row of two fixed
     boxes still has to report their sum as its max-content. */
  .plain { display: flex; flex-direction: column; align-items: center; background: #fee; margin-top: 20px; }
  .plain > div { background: #ffd; }
  .plain .pair { display: flex; gap: 8px; }
  .plain .pair > * { width: 120px; height: 40px; background: #99f; }
</style>
</head>
<body>
  <div class="hero">
    <div class="cta">
      <form>
        <section class="control">
          <div class="control-container">
            <div class="field-wrap">
              <label class="field-label" for="probe-email">Enter your email</label>
              <span><input id="probe-email" type="email" placeholder="you@domain.com"></span>
            </div>
            <button class="submit" type="submit">Sign up for GitHub</button>
          </div>
        </section>
      </form>
      <a class="secondary" href="#">Try GitHub Copilot</a>
    </div>
  </div>

  <div class="plain">
    <div><div class="pair"><i></i><i></i></div></div>
    <input type="text" placeholder="still shown, in red">
  </div>
</body>
</html>
