<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline flow probe</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; }
  section { border-bottom: 2px solid #333; padding: 8px; }
  .brand { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; color: #111; }
  .brand__name { font-weight: 700; font-size: 20px; }
  .brand__meta { font-size: 11px; color: #888; letter-spacing: .08em; }
  .brand__meta::before { content: "|"; margin-right: 8px; color: #ccc; }
  .plainlink span { padding: 0 4px; background: #eef; }
  .ib span { display: inline-block; background: #efe; padding: 2px 6px; }
  .mixed { background: #fee; }
</style>
</head>
<body>
  <section><b>inline-flex brand with two spans</b><br>
    <a class="brand" href="/"><span class="brand__name">Yunseong</span><span class="brand__meta">dev / archive</span></a>
  </section>
  <section><b>plain anchor, two spans</b><br>
    <a class="plainlink" href="/"><span>First</span><span>Second</span><span>Third</span></a>
  </section>
  <section><b>inline-block spans</b><br>
    <span class="ib"><span>Alpha</span><span>Bravo</span><span>Charlie</span></span>
  </section>
  <section><b>mixed inline text and elements</b><br>
    <span class="mixed">Text before <b>bold bit</b> then <i>italic bit</i> and trailing text that should wrap around naturally at the container edge</span>
  </section>
</body>
</html>
