<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Spacing probe</title>
<style>
  :root { --sp-5: 1.25rem; --gutter: 48px; --half: calc(var(--gutter) / 2); }
  body { margin: 0; font: 16px/1.4 sans-serif; }
  p { margin: 0; }
  .box { background: #dde; }
  .m-plain { margin-top: 20px; }
  .m-var { margin-top: var(--sp-5); }
  .m-calc { margin-top: calc(var(--sp-5) * 2); }
  .m-nested { margin-top: var(--half); }
  .rule { border-top: 2px solid #000; }
  /* Gaps written in rem, on both grid and flex. */
  .g { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 1.25rem; }
  .g > :first-child { background: #f00; }
  .g > :last-child { background: #0f0; }
  .f { display: flex; gap: 1.25rem; }
  .f > span { background: #00f; width: 60px; }
  /* The custom property is set on the same element that consumes it, as
     Bootstrap's .container does with --bs-gutter-x. */
  .selfvar { --local-gutter: 1.5rem; padding-left: calc(var(--local-gutter) * .5); background: #fd0; }
  .selfvar > span { background: #808; }
  /* Padding must inset block children, not only inline content. */
  .padded-block { padding-left: 30px; background: #fd0; }
  .padded-block > div { background: #808; }
  .maxw { max-width: 720px; margin: 0 auto; padding-left: 12px; background: #cfc; }
  .maxw > div { background: #063; }
  /* The same centred container under border-box, as Bootstrap ships it. */
  .bb, .bb * { box-sizing: border-box; }
  .bb { max-width: 720px; margin: 0 auto; padding-left: 12px; background: #ccf; }
  .bb > div { background: #006; }
  /* A page that overlaps two sections on purpose pulls one back with a
     negative margin — a percentage of the containing block's *width*, on
     either axis. */
  .neg { width: 400px; background: #eef; margin-top: 20px; }
  .neg > div { height: 40px; }
  .n1 { background: #9f9; }
  .n2 { background: #f99; margin-top: -10%; }
  .n3 { background: #99f; margin-top: -20px; }
  .n4 { background: #ff9; margin-top: 10%; }
  /* An <svg> with no viewBox takes its ratio from its width/height attributes. */
  .svgratio { width: 400px; background: #dfd; }
  .svgratio svg { width: 100%; height: auto; display: block; background: #8c8; }
</style>
</head>
<body>
  <div class="rule"></div><p class="box">anchor</p><p class="box m-plain">plain 20px</p>
  <div class="rule"></div><p class="box">anchor</p><p class="box m-var">var 20px</p>
  <div class="rule"></div><p class="box">anchor</p><p class="box m-calc">calc var 40px</p>
  <div class="rule"></div><p class="box">anchor</p><p class="box m-nested">nested var 24px</p>
  <div class="rule"></div><div class="g"><div>01</div><div>grid gap 20px</div></div>
  <div class="rule"></div><div class="f"><span>a</span><span>b</span></div>
  <div class="rule"></div><div class="selfvar"><span>self-var padding should be 12px</span></div>
  <div class="rule"></div><div class="padded-block"><div>block child inset by 30px</div></div>
  <div class="rule"></div><div class="maxw"><div>centred container, child at 52px</div></div>
  <div class="rule"></div><div class="bb"><div>border-box container, child at 52px</div></div>
  <div class="rule"></div>
  <div class="neg">
    <div class="n1"></div><div class="n2"></div><div class="n3"></div><div class="n4"></div>
  </div>
  <div class="svgratio"><svg width="800" height="200" aria-hidden="true"></svg></div>
</body>
</html>
