name: Release Linux browser

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build release binaries
        run: cargo build --release --locked --bins
      - name: Package and verify binaries
        run: |
          tar -czf browser-linux-x86_64.tar.gz -C target/release browser browser-daemon browser-cli
          test "$(tar -tzf browser-linux-x86_64.tar.gz | wc -l)" -eq 3
          tar -tzf browser-linux-x86_64.tar.gz
      - name: Save archive for pull request review and release upload
        uses: actions/upload-artifact@v4
        with:
          name: browser-linux-x86_64
          path: browser-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified archive
        uses: actions/download-artifact@v4
        with:
          name: browser-linux-x86_64
          path: release
      - name: Attach archive to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/browser-linux-x86_64.tar.gz --clobber
