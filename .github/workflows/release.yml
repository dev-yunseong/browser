name: Release browser

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked --bins
      - name: Run library tests
        run: cargo test --release --locked --lib -- --test-threads=2
      - name: Package and verify binaries
        if: runner.os != 'Windows'
        run: |
          tar -czf browser-${{ matrix.target }}.tar.gz -C target/release browser browser-daemon browser-cli
          test "$(tar -tzf browser-${{ matrix.target }}.tar.gz | wc -l)" -eq 3
          tar -tzf browser-${{ matrix.target }}.tar.gz
      - name: Package and verify binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "browser-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/browser.exe, target/release/browser-daemon.exe, target/release/browser-cli.exe -DestinationPath $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive)).Entries
          $entries | ForEach-Object { $_.FullName }
          if ($entries.Count -ne 3) { throw "expected 3 files in $archive, found $($entries.Count)" }
      - name: Save archive for pull request review and release upload
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.target }}
          path: browser-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: release
          merge-multiple: true
      - name: Attach archives to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
